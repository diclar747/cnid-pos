# Compila la app en GitHub y publica el resultado en la rama `panel`.
# El panel cdpanel compila con 1 vCPU y un tope de 10 minutos que `next build` no alcanza;
# desplegando la rama `panel`, el panel solo instala dependencias y `npm run build`
# detecta el build ya hecho (.next/PREBUILT) y no vuelve a compilar.
name: Build para el panel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: panel-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Publicar en la rama panel
        run: |
          rm -rf .next/cache
          echo "${GITHUB_SHA}" > .next/PREBUILT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan panel-build
          git add -A
          git add -f .next
          git commit -q -m "Build para el panel de ${GITHUB_SHA::7}"
          git push -f origin HEAD:panel
